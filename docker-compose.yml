# === Neo4j Graph Database ===
  neo4j:
    image: neo4j:5
    container_name: synergesis-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-synergesis-secret}
      - NEO4J_MEMORY_HEAP_INITIAL=4G
      - NEO4J_MEMORY_HEAP_MAX=4G
      - NEO4J_MEMORY_PAGECACHE=4G
      - NEO4J_dbms_default__listen__address=0.0.0.0
      - NEO4J_dbms_connector_bolt_advertised__address=localhost:7687
      - NEO4J_dbms_connector_http_advertised__address=localhost:7474
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./scripts/init.cql:/docker-entrypoint-initdb.d/init.cql
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '4'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === Optional: Agent Worker (Future Use) ===
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synergesis-agent
    environment:
      - LLM_MODEL=gpt-3.5-turbo
      - SERPAPI_KEY=${SERPAPI_KEY}
    volumes:
      - ./sandbox:/app/sandbox
      - ./memory:/app/memory
    depends_on:
      - neo4j
    restart: unless-stopped

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Syn Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; padding: 1rem; overflow-y: auto; background: #f7f7f7; }
    .msg { margin-bottom: 0.5rem; }
    .user { color: #3366ff; }
    .syn { color: #009966; }
    #inputBar { display: flex; border-top: 1px solid #ccc; }
    #text { flex: 1; padding: 1rem; border: none; font-size: 1rem; }
    #send { padding: 1rem 2rem; border: none; background: #3366ff; color: white; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div id="messages"></div>
  <div id="inputBar">
    <input id="text" type="text" placeholder="Say something to Syn…" />
    <button id="send">Send</button>
  </div>

  <script>
    const apiUrl = "/syn/chat";
    const messagesDiv = document.getElementById("messages");
    const textInput = document.getElementById("text");
    const sendBtn = document.getElementById("send");

    function appendMsg(content, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = content;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function send() {
      const msg = textInput.value.trim();
      if (!msg) return;
      appendMsg("You: " + msg, "user");
      textInput.value = "";
      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        if (data.responses && data.responses.length) {
          data.responses.forEach(r => appendMsg("Syn: " + r.content, "syn"));
        } else {
          appendMsg("Syn is thinking…", "syn");
        }
      } catch (err) {
        appendMsg("Error: " + err, "syn");
      }
    }

    sendBtn.onclick = send;
    textInput.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergesis Chat - Parlez à vos Agents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .message.agent {
            background: #f1f3f4;
            color: #333;
            align-self: flex-start;
            border-left: 4px solid #4facfe;
        }

        .message .sender {
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .message .content {
            line-height: 1.4;
        }

        .message .timestamp {
            font-size: 0.7em;
            opacity: 0.6;
            margin-top: 5px;
        }

        .chat-input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            border-color: #4facfe;
        }

        .send-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            padding: 10px 18px;
            background: #f1f3f4;
            border-radius: 18px;
            align-self: flex-start;
            margin-bottom: 10px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .agent-selector {
            margin-bottom: 10px;
        }

        .agent-selector select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        .welcome-message {
            text-align: center;
            color: #666;
            font-style: italic;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="status-indicator" id="statusIndicator"></div>
            <h1>🌟 Synergesis Chat</h1>
            <p>Conversez avec vos agents intelligents</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                👋 Bonjour ! Je suis votre système Synergesis. Posez-moi une question ou commencez une conversation !
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="agent-selector">
                <label for="agentSelect">Agent ciblé :</label>
                <select id="agentSelect">
                    <option value="all">Tous les agents</option>
                    <option value="Aura">Aura (Empathie)</option>
                    <option value="Nous">Nous (Raisonnement)</option>
                    <option value="Selene">Selene (Créativité)</option>
                    <option value="Thales">Thales (Logique)</option>
                    <option value="DeepResearch">DeepResearch (Recherche)</option>
                </select>
            </div>
            <div class="chat-input-wrapper">
                <input 
                    type="text" 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="Tapez votre message ici..."
                    maxlength="500"
                >
                <button id="sendButton" class="send-button">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        class SynergesisChat {
            constructor() {
                this.chatMessages = document.getElementById('chatMessages');
                this.chatInput = document.getElementById('chatInput');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.agentSelect = document.getElementById('agentSelect');
                
                this.initializeEventListeners();
                this.connectWebSocket();
            }

            initializeEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });
            }

            connectWebSocket() {
                try {
                    this.ws = new WebSocket(`ws://${window.location.host}/ws`);
                    
                    this.ws.onopen = () => {
                        console.log('WebSocket connecté');
                        this.statusIndicator.style.background = '#4CAF50';
                    };

                    this.ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        this.handleAgentResponse(data);
                    };

                    this.ws.onclose = () => {
                        console.log('WebSocket fermé');
                        this.statusIndicator.style.background = '#f44336';
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };

                    this.ws.onerror = (error) => {
                        console.error('Erreur WebSocket:', error);
                        this.statusIndicator.style.background = '#ff9800';
                    };
                } catch (error) {
                    console.error('Erreur de connexion WebSocket:', error);
                    this.statusIndicator.style.background = '#f44336';
                }
            }

            async sendMessage() {
                const message = this.chatInput.value.trim();
                if (!message) return;

                const selectedAgent = this.agentSelect.value;
                
                // Afficher le message utilisateur
                this.addMessage(message, 'user', 'Vous');
                this.chatInput.value = '';
                this.sendButton.disabled = true;
                
                // Afficher l'indicateur de frappe
                this.showTypingIndicator();

                try {
                    // Envoyer via WebSocket si disponible, sinon via HTTP
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            message: message,
                            agent: selectedAgent
                        }));
                    } else {
                        // Fallback HTTP
                        const response = await fetch('/syn/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ message: message })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            this.handleAgentResponse(data);
                        } else {
                            throw new Error('Erreur de communication avec les agents');
                        }
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    this.addMessage('Désolé, je ne peux pas répondre pour le moment. Vérifiez la connexion.', 'agent', 'Système');
                } finally {
                    this.hideTypingIndicator();
                    this.sendButton.disabled = false;
                }
            }

            handleAgentResponse(data) {
                this.hideTypingIndicator();
                
                if (data.agents && Array.isArray(data.agents)) {
                    // Réponses multiples d'agents
                    data.agents.forEach(agent => {
                        if (agent.response && agent.response.trim()) {
                            this.addMessage(agent.response, 'agent', agent.name || 'Agent');
                        }
                    });
                } else if (data.response) {
                    // Réponse simple
                    this.addMessage(data.response, 'agent', 'Synergesis');
                } else if (data.message) {
                    this.addMessage(data.message, 'agent', 'Système');
                }
            }

            addMessage(content, type, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                
                const timestamp = new Date().toLocaleTimeString('fr-FR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });

                messageDiv.innerHTML = `
                    <div class="sender">${sender}</div>
                    <div class="content">${this.escapeHtml(content)}</div>
                    <div class="timestamp">${timestamp}</div>
                `;

                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            showTypingIndicator() {
                this.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }

            hideTypingIndicator() {
                this.typingIndicator.style.display = 'none';
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialiser le chat quand la page est chargée
        document.addEventListener('DOMContentLoaded', () => {
            new SynergesisChat();
        });
    </script>
</body>
</html>

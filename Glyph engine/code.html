<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil d'Analyse Symbolique de Glyphes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Outil d'Analyse Symbolique de Glyphes</h1>
        </header>

        <main class="main-layout">
            <section class="controls-generation">
                <h2>Création & Contrôle</h2>
                <div class="button-group">
                    <button id="genAutoBtn">Générer (Auto)</button>
                    <button id="genRuleBtn">Générer (Règles)</button> <!-- Placeholder -->
                </div>
                <div class="button-group">
                     <button id="combineBtn" disabled>Combiner Glyphes (Sélectionnez 2)</button>
                     <button id="clearCanvasBtn">Effacer Canvas</button>
                </div>
                 <div class="button-group">
                    <button id="saveSelectedBtn" disabled>Archiver Sélection</button>
                    <button id="exportArchiveBtn">Exporter Archive (JSON)</button>
                     <label for="importFile" class="button-like">Importer Archive (JSON)</label>
                     <input type="file" id="importFile" accept=".json" style="display: none;">
                </div>
                 <!-- Zone pour règles futures -->
                 <div id="ruleInputs" style="display: none; margin-top: 10px; border: 1px dashed #ccc; padding: 5px;">
                     <label>Polarité:</label> <select id="rulePolarity"><option value="any">Indiff.</option><option value="+">+</option><option value="-">-</option><option value="0">0</option></select>
                     <label>Freq Min:</label> <input type="number" id="ruleFreqMin" value="1" min="1" max="100" style="width: 50px;">
                     <!-- Ajouter d'autres règles ici -->
                 </div>
            </section>

            <section class="canvas-container">
                <h2>Espace d'Expérimentation</h2>
                <canvas id="glyphCanvas"></canvas>
            </section>

            <aside class="analysis-panel">
                <h2>Analyse Symbolique</h2>
                <div id="analysisContent">
                    <p>Sélectionnez un ou deux glyphes pour afficher leurs propriétés et leur compatibilité.</p>
                </div>
                 <div id="compatibilityScore" style="margin-top: 15px;"></div>
            </aside>

            <aside class="archive-panel">
                <h2>Archive des Glyphes</h2>
                <input type="text" id="searchArchiveInput" placeholder="Rechercher par ID, polarité, tag...">
                <ul id="archiveList">
                    <!-- Les glyphes archivés seront listés ici -->
                </ul>
                 <button id="clearArchiveBtn">Vider l'Archive</button>
            </aside>
        </main>

    </div>

    <script src="glyphUtils.js"></script>
    <script src="glyphEngine.js"></script>
</body>
</html>

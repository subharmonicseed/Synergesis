name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            python -m pip install -c constraints-py312.txt ".[test]"
          else
            python -m pip install ".[test]"
          fi
      - name: Verify source manifest
        run: python scripts/verify_manifest.py
      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest-receipt.txt
      - name: Capture environment
        if: always()
        shell: bash
        run: |
          python --version > python-environment.txt
          python -m pip freeze >> python-environment.txt
          echo "$GITHUB_SHA" > tested-commit.txt
      - name: Preserve validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: |
            pytest-receipt.txt
            python-environment.txt
            tested-commit.txt
            MANIFEST_SHA256.json
